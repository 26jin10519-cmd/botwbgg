name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      file_name:
        description: 'botw.nsp'
        required: true
        default: 'botw.nsp'

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. 저장소 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

     # 2. 필수 빌드 의존성 및 패키지 설치
      - name: Install Build Dependencies
        run: |
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic

   # 3. 인코딩 없이 환경 변수 원문 그대로 파일 생성
      - name: Setup prod.keys and title.keys
        env:
          PROD_KEYS_RAW: ${{ secrets.PROD_KEYS }}
          TITLE_KEYS_RAW: ${{ secrets.TITLE_KEYS }}
        run: |
          mkdir -p keys

          # Python을 사용해 환경변수 원본 줄바꿈 그대로 파일에 작성
          python3 -c "
          import os
          with open('keys/prod.keys', 'w', encoding='utf-8') as f:
              f.write(os.environ.get('PROD_KEYS_RAW', ''))
          with open('keys/title.keys', 'w', encoding='utf-8') as f:
              f.write(os.environ.get('TITLE_KEYS_RAW', ''))
          "

          echo "=== 키 파일 생성 검증 ==="
          ls -lh keys/
          echo "prod.keys 줄 수: $(wc -l < keys/prod.keys)"
          echo "title.keys 줄 수: $(wc -l < keys/title.keys)"

          # 필수 키 확인
          grep -i "header_key" keys/prod.keys || echo "::warning::header_key가 prod.keys에 보이지 않습니다."

      # 4. 다운로드 및 파일 유효성 검사
      - name: Download Game Dump from Hugging Face
        run: |
          mkdir -p Games/TargetGame
          curl -L -f \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -o "Games/TargetGame/${{ github.event.inputs.file_name }}" \
            "https://huggingface.co/datasets/mangonam/botwbggg-data/resolve/main/${{ github.event.inputs.file_name }}"

          echo "=== 다운로드 파일 체크 ==="
          ls -lh Games/TargetGame/
          file "Games/TargetGame/${{ github.event.inputs.file_name }}"

      # 5. nxnative 빌드 스크립트 실행 (NSP -> IPA 변환)
      - name: Build IPA from NSP
        run: |
          python3 scripts/build_ipa_from_nsp.py Games/TargetGame -k keys/prod.keys

      # 6. 생성된 IPA 파일 아티팩트로 업로드
      - name: Upload Built IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-game-ipa
          path: Games/TargetGame/*.ipa
          retention-days: 7
