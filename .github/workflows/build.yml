name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      file_name:
        description: 'Hugging Face Dataset에 업로드된 NSP 파일명'
        required: true
        default: 'game_dump.nsp'

jobs:
  build:
    runs-on: macos-latest
    # 타임아웃 제한 완전 삭제 (GitHub 최대치인 6시간 동안 절대 안 끊김)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Maximize Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /Library/Frameworks/Mono.framework || true
          sudo rm -rf /Applications/Xcode_15*.app || true
          df -h

      - name: Install Build Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install xcodegen zstd glslang || true
          brew install --cask dotnet-sdk || true
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic

      - name: Setup and Validate Switch Keys
        env:
          PROD_KEYS_RAW: ${{ secrets.PROD_KEYS }}
          TITLE_KEYS_RAW: ${{ secrets.TITLE_KEYS }}
        run: |
          mkdir -p keys ~/.switch
          python3 - << 'EOF'
          import os, sys

          prod = os.environ.get('PROD_KEYS_RAW', '').replace('\r\n', '\n').replace('\r', '\n').strip()
          title = os.environ.get('TITLE_KEYS_RAW', '').replace('\r\n', '\n').replace('\r', '\n').strip()

          if not prod:
              print('::error::PROD_KEYS Secret이 비어있습니다.')
              sys.exit(1)

          combined = prod + ('\n' + title if title else '')
          with open('keys/prod.keys', 'w', encoding='utf-8') as f:
              f.write(combined)
          if title:
              with open('keys/title.keys', 'w', encoding='utf-8') as f:
                  f.write(title + '\n')

          home_sw = os.path.expanduser('~/.switch')
          with open(os.path.join(home_sw, 'prod.keys'), 'w', encoding='utf-8') as f:
              f.write(combined)
          if title:
              with open(os.path.join(home_sw, 'title.keys'), 'w', encoding='utf-8') as f:
                  f.write(title + '\n')
          EOF

      - name: Patch iOS Source Syntax Error
        run: |
          python3 - << 'EOF'
          import glob, re

          for path in glob.glob('**/DmGamepad.m', recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              if 'deviceMotionBody' in content:
                  lines = content.splitlines()
                  patched = []
                  for line in lines:
                      if 'deviceMotionBody' in line:
                          if re.search(r'deviceMotionBody\s*=[^=]', line):
                              patched.append('// ' + line)
                          else:
                              patched.append(line.replace('deviceMotionBody', 'deviceMotion'))
                      else:
                          patched.append(line)
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write('\n'.join(patched) + '\n')
          EOF

      - name: Download Game Dump from Hugging Face
        run: |
          mkdir -p Games/TargetGame
          TARGET_PATH="Games/TargetGame/${{ github.event.inputs.file_name }}"

          curl -L -f --retry 5 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -o "$TARGET_PATH" \
            "https://huggingface.co/datasets/mangonam/botwbggg-data/resolve/main/${{ github.event.inputs.file_name }}"

      - name: Build IPA from NSP
        env:
          ALLOW_OTHER_METAL: "True"
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
          AD_HOC_CODE_SIGNING_ALLOWED: "YES"
        run: |
          # 추출 감지 시 14GB 원본 파일 자동 삭제 (디스크 100% 방지)
          (
            while true; do
              if ls Games/TargetGame/*_build/extract/v0/icon.jpg >/dev/null 2>&1; then
                rm -f "Games/TargetGame/${{ github.event.inputs.file_name }}"
                break
              fi
              sleep 15
            done
          ) &

          # 빌드 실행
          python3 scripts/build_ipa_from_nsp.py Games/TargetGame -k keys/prod.keys --allow-other-metal

          # .app 번들을 직접 Payload 구조로 .ipa 패키징
          mkdir -p output_ipa/Payload
          FOUND_APP=$(find Games/TargetGame -type d -name "*.app" | head -n 1)
          if [ -n "$FOUND_APP" ]; then
            cp -R "$FOUND_APP" output_ipa/Payload/
            (cd output_ipa && zip -r -q "ZeldaBotW.ipa" Payload)
            rm -rf output_ipa/Payload
          else
            find Games/TargetGame -type f -name "*.ipa" -exec mv {} output_ipa/ZeldaBotW.ipa \;
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaBotW-iOS-IPA
          path: output_ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
