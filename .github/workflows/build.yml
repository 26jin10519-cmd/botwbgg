name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      file_name:
        description: 'botw.nsp'
        required: true
        default: 'botw.nsp'

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. 저장소 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

     # 2. 필수 빌드 의존성 및 패키지 설치
      - name: Install Build Dependencies
        run: |
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic

    # 3. prod.keys 복원 및 형식 검증
      - name: Setup prod.keys
        env:
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p keys
          echo "$PROD_KEYS_B64" | tr -d '\r' | base64 --decode > keys/prod.keys
          
          echo "=== 키 파일 무결성 체크 ==="
          ls -lh keys/prod.keys
          grep -i "header_key" keys/prod.keys || { echo "ERROR: header_key 없음"; exit 1; }

      # 4. 다운로드 및 파일 유효성 검사
      - name: Download Game Dump from Hugging Face
        run: |
          mkdir -p Games/TargetGame
          curl -L -f \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -o "Games/TargetGame/${{ github.event.inputs.file_name }}" \
            "https://huggingface.co/datasets/mangonam/botwbggg-data/resolve/main/${{ github.event.inputs.file_name }}"

          echo "=== 다운로드 파일 체크 ==="
          ls -lh Games/TargetGame/
          file "Games/TargetGame/${{ github.event.inputs.file_name }}"

      # 5. nxnative 빌드 스크립트 실행 (NSP -> IPA 변환)
      - name: Build IPA from NSP
        run: |
          python3 scripts/build_ipa_from_nsp.py Games/TargetGame -k keys/prod.keys

      # 6. 생성된 IPA 파일 아티팩트로 업로드
      - name: Upload Built IPA
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-game-ipa
          path: Games/TargetGame/*.ipa
          retention-days: 7
